<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="店舗運営" />
  <meta name="description" content="飲食店の経営・現場管理をまとめるホームUIプロトタイプ" />
  <title>飲食店運営アプリ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">店舗運営</p>
        <h1>飲食店運営アプリ</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="alertsBtn" aria-label="通知">🔔<span class="dot"></span></button>
        <button class="edit-btn" id="editBtn">編集</button>
      </div>
    </header>

    <section class="store-strip">
      <div class="store-avatar">店</div>
      <div class="store-copy">
        <strong>現在の店舗</strong>
        <span>店舗を選択</span>
      </div>
      <button class="chevron" aria-label="店舗を変更">⌄</button>
    </section>

    <section class="intro-card" id="introCard">
      <div class="intro-icon">▦</div>
      <div>
        <strong>必要な機能だけホームに表示</strong>
        <p>編集モードで並べ替え・非表示・追加ができます。</p>
      </div>
    </section>

    <section class="section-head">
      <div>
        <h2>ホーム</h2>
        <p id="modeText">よく使う機能</p>
      </div>
      <button class="reset-btn" id="resetBtn" hidden>初期状態に戻す</button>
    </section>

    <section class="tile-grid" id="tileGrid" aria-live="polite"></section>

    <button class="add-card" id="addCard" hidden>
      <span class="plus">＋</span>
      <span><strong>機能を追加</strong><small>非表示にした機能を戻す</small></span>
    </button>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="active"><span>⌂</span>ホーム</button>
      <button><span>▥</span>ダッシュボード</button>
      <button><span>✉</span>お知らせ</button>
      <button><span>⚙</span>設定</button>
    </nav>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="bottom-sheet" id="bottomSheet" aria-modal="true" role="dialog" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <p class="eyebrow">カスタマイズ</p>
        <h3>ホームに機能を追加</h3>
      </div>
      <button class="icon-btn" id="closeSheet" aria-label="閉じる">✕</button>
    </div>
    <div class="hidden-list" id="hiddenList"></div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
