<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b997a9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="店舗運営">
<meta name="description" content="飲食店の経営・現場管理をまとめる店舗運営ホーム">
<title>店舗運営</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>

<main class="app-shell">
  <header class="ios-header">
    <button class="store-pill" id="storeBtn" type="button">
      <img src="app-icon.svg" alt="" width="28" height="28">
      <span><small>店舗運営</small><strong>店舗を選択</strong></span>
      <span class="store-chevron" data-icon="chevron"></span>
    </button>
    <button class="edit-btn" id="editBtn" type="button" aria-pressed="false">
      <span id="editLabel">編集</span>
    </button>
  </header>

  <div class="edit-hint" id="introCard" hidden>
    <span class="hint-icon" data-icon="move"></span>
    <span>長押し・ドラッグで並べ替え。−で非表示。</span>
    <button class="reset-btn" id="resetBtn" type="button">リセット</button>
  </div>

  <section class="tile-grid" id="tileGrid" aria-label="業務アプリ"></section>

  <div class="empty-state" id="emptyState" hidden>
    <strong>ホームが空です</strong>
    <span>「機能を追加」から戻せます。</span>
  </div>

  <button class="add-card" id="addCard" type="button" hidden>
    <span data-icon="plus"></span>
    <span>機能を追加</span>
  </button>

  <section class="home-controls" aria-label="ホーム画面コントロール">
    <div class="page-dots" aria-hidden="true"><span class="active"></span><span></span></div>
    <button class="search-pill" id="searchBtn" type="button"><span data-icon="search"></span><span>検索</span></button>
  </section>

  <nav class="ios-dock" id="dockGrid" aria-label="固定ショートカット"></nav>
</main>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<section class="bottom-sheet" id="bottomSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">機能を追加</h2>
    <button class="close-btn" id="closeSheet" type="button" aria-label="閉じる" data-icon="close"></button>
  </div>
  <div id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">ホームの編集にはJavaScriptを有効にしてください。</p></noscript>

<script src="icons.js"></script>
<script src="home-state.js"></script>
<script src="app.js"></script>
</body>
</html>
