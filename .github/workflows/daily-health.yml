name: Daily app health (no AI)
on:
  schedule:
    - cron: '41 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['operations.json', 'scripts/ops-health.mjs', '.github/workflows/daily-health.yml']
permissions:
  contents: read
concurrency:
  group: restaurant-daily-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/home-state.test.cjs tests/ops-model.test.cjs tests/costing.test.cjs
      - run: node scripts/ops-health.mjs --self-test
      - run: node scripts/ops-health.mjs
