name: UI checks

on:
  push:
    branches:
      - main
      - work/ui-refresh-handoff-20260920
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check icons.js
          node --check home-state.js
          node --check ops-model.js
          node --check ops-ui.js
      - name: State tests
        run: node --test tests/*.test.cjs
      - name: Install browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflows (one browser, sequential)
        run: npm run test:browser
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: test-results/
      - name: Required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f icon-candidates.html
          test -f manifest.webmanifest
          for f in icons/candidate-{a-grid,b-noren,c-plate-grid,d-r,e-check-store,f-cards,g-compass,h-nine-dots}.svg; do test -f "$f"; done
