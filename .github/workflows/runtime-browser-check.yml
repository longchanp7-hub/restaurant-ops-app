name: Runtime browser check

on:
  push:
    branches:
      - test/runtime-check-20261001

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Run mobile interaction checks against production Pages
        env:
          TARGET_URL: https://longchanp7-hub.github.io/restaurant-ops-app/
        run: node tests/runtime-check.mjs
      - name: Upload runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-check-mobile
          path: runtime-check-mobile.png
          if-no-files-found: ignore
